name: khm-bench
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    mem_limit: 2g
    ports: ["19092:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes: [bench-kafka:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, kafka-topics, --bootstrap-server, kafka:29092, --list]
      interval: 5s
      timeout: 5s
      retries: 30
  khm:
    build: .
    mem_limit: 2g
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["18080:8080"]
    environment:
      KHM_RUN_ID: ${KHM_RUN_ID:?Set KHM_RUN_ID using the benchmark runner}
      KHM_DB_PATH: /app/data/lag_history.db
      PYTHONUNBUFFERED: '1'
    volumes:
      - ${KHM_BENCH_CONFIG:-./config.bench.yml}:/app/config.yml:ro
      - bench-history:/app/data
volumes:
  bench-history:
  bench-kafka:
