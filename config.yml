alerts:
  critical_threshold: 10000
  warning_threshold: 1000
clusters:
- bootstrap_servers: kafka:29092
  color: teal
  name: dev
- bootstrap_servers: kafka:29092
  color: yellow
  name: staging
- bootstrap_servers: kafka:29092
  color: red
  name: production
exclude_groups: []
exclude_topics: []
monitor:
  history_retention_days: 7
  refresh_interval: 5
forecast:
  persist_every_cycle: true
  trend_deadband_msgs_per_sec: 0.05
  window_hours: 1
recommendations:
  max_per_cluster: 10
  max_per_pair: 2
  rebalance_cycles_threshold: 3
  confidence_gate: [HIGH, MEDIUM]
web:
  host: 0.0.0.0
  port: 8080
