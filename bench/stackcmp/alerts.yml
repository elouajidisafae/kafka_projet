# Sources and equivalence limits are documented in SOURCES.md.
# No rebalance alert is enabled: kafka_exporter v1.10.0 has no group-state metric.
groups:
  - name: stackcmp
    interval: 5s
    rules:
      - record: stackcmp:lag
        expr: sum by (cluster, consumergroup, topic) (clamp_min(kafka_consumergroup_lag, 0) and on (cluster, consumergroup, topic, partition) (kafka_consumergroup_current_offset >= 0))
      - record: stackcmp:members
        expr: max by (cluster, consumergroup) (kafka_consumergroup_members)
      - record: stackcmp:partitions
        expr: max by (cluster, topic) (kafka_topic_partitions)
      - record: stackcmp:pair_members
        expr: (stackcmp:lag * 0) + on (cluster, consumergroup) group_left stackcmp:members
      - record: stackcmp:pair_partitions
        expr: (stackcmp:lag * 0) + on (cluster, topic) group_left stackcmp:partitions
      - record: stackcmp:slope
        expr: deriv(stackcmp:lag[1h])
      - record: stackcmp:r_squared
        expr: clamp_max(clamp_min((deriv(stackcmp:lag[1h]) ^ 2) * stdvar_over_time(timestamp(stackcmp:lag)[1h:5s]) / clamp_min(stdvar_over_time(stackcmp:lag[1h]), 1e-9), 0), 1)
      - record: stackcmp:critical_eta_seconds
        expr: (10000 - predict_linear(stackcmp:lag[1h], 0)) / deriv(stackcmp:lag[1h])
      - record: stackcmp:projected_critical
        expr: (stackcmp:critical_eta_seconds > 0) and (stackcmp:slope > 0.05) and (stackcmp:r_squared >= 0.5) and (stackcmp:lag < 10000) and (count_over_time(stackcmp:lag[1h]) >= 5)
      - alert: ProjectedCritical
        expr: stackcmp:projected_critical
        labels:
          severity: warning
      - alert: ScaleConsumerGroup
        expr: stackcmp:projected_critical and (stackcmp:pair_members < stackcmp:pair_partitions) and (stackcmp:pair_members > 0)
        labels:
          severity: warning
      - alert: StrandedMessages
        expr: (stackcmp:lag > 1000) and (stackcmp:pair_members == 0)
        labels:
          severity: critical
      - alert: StalledProcessing
        expr: (stackcmp:lag >= 10000) and (abs(stackcmp:slope) <= 0.05) and (stackcmp:pair_members > 0) and (count_over_time(stackcmp:lag[1h]) >= 5)
        labels:
          severity: critical
