sampling:
  origins: all canonical exact ordered input-ID observations, earliest persisted row;
    within each generator first/last observation; no minute sampling
  inputs: exact saved ordered input_ids_json; shared one-hour maximum raw history,
    selected responsive window 5 min / .5; no downsampling for OLS/Responsive
  nonlinear: existing regular_series right-edge five-second grid, causal carry-forward;
    Holt fixed initialization; ARIMA d=1 with drift and convergence failure handling
    unchanged; failures stay missing and counted
ranges:
  v1: bench/range_calibration.yml
  v2: bench/range_calibration_v2.yml
  applicable_models:
  - OLS
  - Responsive
  positive_domain: 0 < predicted remaining <=1800 sec and issue time < observed crossing;
    horizon bins use predicted remaining time
  grouping: v1 horizon-only; v2 frozen per-mode candidate and n<200 horizon fallback;
    no refit/recalibration
  beyond_30: v1 retained for comparison; v2 no range when predicted >1800 sec; do
    not truncate upper bounds of shorter predictions
metrics:
  truth: first measured lag CRITICAL crossing, linear interpolation between bracketing
    samples; independent produced-consumed crossing for quality checks
  table5:
    source: bench/model_comparison_alignment.py:aligned_model
    creeping_sawtooth: abs(issue_time + positive ETA - observed crossing), issued
      before crossing; bins by ACTUAL remaining horizon (0,300], (300,900], (900,1800]
      sec
    burst: secondary_metrics S5_after_M1_0-15; issue >= metadata.started_at + burst_at
      + burst_seconds (burst END), before crossing, 0 < actual remaining <=900 sec,
      positive ETA
    aggregation: median absolute error within each repetition, then median and inclusive
      Q1/Q3 across repetitions; missing cells null, counts retained
  positive_crossing_coverage: 'same Table 5 temporal cells: positive ETA and enough_data
    / ALL canonical eligible origins including missing/failed/no-crossing; per-repetition
    fractions plus median inclusive Q1/Q3 and pooled counts; do not mistake conditional
    error for unconditional coverage'
  stable_false_crossings: 'bench.model_comparison_alignment.false_crossing: share
    0 < ETA <=1800 among available forecasts; missing counted separately; median inclusive
    Q1/Q3 of repetition shares'
  gated_advice: 'OLS and Responsive only: existing recommender.analyze_row with confidence
    gate HIGH/MEDIUM and existing short-trend eligibility; scale/topology, HIGH/MEDIUM.
    No invented Holt/ARIMA R2 gate (N/A). Replay all matching pair rules apply_cap=False
    as archived; no new cap/rule Applied to OLS and Responsive with chosen N and N=1;
    same point forecasts for both policies, per-rule independent collection-cycle
    counters.'
  stable_gated_advice: 'archived M6_false_alarm_cycle_fraction: distinct advice timestamps
    / canonical forecasts per stable repetition; also S1_fill_advice_fraction and
    S1_after_fill_advice_fraction mapped to preceding origin, boundary metadata.started_at+fill_seconds.
    Report live-recorded OLS advice separately and check exact-input rule-set fidelity'
  advice_lead: archived M4_advice_lead_seconds = crossing minus earliest HIGH/MEDIUM
    scale/topology advice strictly before crossing; missing if none. Also archived
    S2_critical_minus_advice signed lead to first advice
  range_coverage: v1 and v2, OLS and Responsive, each crossing workload and pooled;
    bins (0,300], (300,900], (900,1800] sec of PREDICTED remaining. Share observed
    remaining inside inclusive bounds; missing range uncovered. Median width in seconds
    over finite shown bounds, n/range_n/covered retained; pooled 0-30 separately
  stable_showing_range: all canonical stable forecasts including nonpositive/missing
    in denominator; v1/v2 counts and shares all, predicted 0-30, predicted >30; v2
    >30 count must be zero
  failures: all origins, availability/missing, numerical fit failures/reasons, timing,
    OLS recorded-versus-replay field mismatches; retain outliers and failed fits,
    no fallback model
quality:
  rate_relative_drift_max: 0.05
  commit_gap_seconds_max: 1
  starts_at_zero: true
  independent_truth_agreement_seconds: 5
  truth_agreement_fraction_min: 0.95
  flat_must_not_cross: true
  unexplained_OLS_field_mismatches: 0
  unexplained_recorded_advice_rule_set_mismatches: 0
  policy: report checks and keep all results even if quality fails; no silent repeat
    or exclusion
