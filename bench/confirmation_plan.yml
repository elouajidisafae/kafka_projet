version: 1
tag: revision-r1-confirmation-frozen
no_tuning_after_recording: true
statement: All models, ranges, metrics, sampling and acceptance rules are frozen before
  any confirmation recording. No setting, grouping, factor, threshold, model order,
  seed-selection rule or evaluation code will change after a new recording exists.
  No selection on confirmation data.
hash_convention: SHA256 of tracked file bytes with CRLF normalized to LF; plan SHA256
  is computed from the committed tag blob and recorded in the sealed manifest. Guard
  requires clean tree and HEAD equal to frozen tag.
models:
  OLS:
    family: OLS
    fitter: bench.replay.Baseline -> core.forecasting.fit_forecast (unchanged original/default
      OLS fitter)
    method: baseline
    window_hours: 1
    settings_file: config.bench.yml
  Responsive:
    family: OLS multiwindow
    short_window_minutes: 5
    agreement_tolerance: 0.5
    interval_level: 0.9
    settings_file: bench/forecaster_params_responsive.yml
  Holt:
    family: Holt
    alpha: 0.2
    beta: 0.2
    settings_file: bench/model_comparison_params.yml
  ARIMA_212:
    family: ARIMA
    order:
    - 2
    - 1
    - 2
    trend: t
    settings_file: bench/model_comparison_params.yml
    analysis_class: confirmatory
  ARIMA_211_exploratory:
    family: ARIMA
    order:
    - 2
    - 1
    - 1
    trend: t
    settings_file: bench/model_comparison_params_arima_check.yml
    analysis_class: exploratory; fixed before fresh recording, not selected anew
ranges:
  v1: bench/range_calibration.yml
  v2: bench/range_calibration_v2.yml
  applicable_models:
  - OLS
  - Responsive
  positive_domain: 0 < predicted remaining <=1800 sec and issue time < observed crossing;
    horizon bins use predicted remaining time
  grouping: v1 horizon-only; v2 frozen per-mode candidate and n<200 horizon fallback;
    no refit/recalibration
  beyond_30: v1 retained for comparison; v2 no range when predicted >1800 sec; do
    not truncate upper bounds of shorter predictions
